---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: postgres-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true

    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible/tmp

verifier:
  name: ansible
